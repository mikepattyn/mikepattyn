name: Deploy Mikepattyn content

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mikepattyn/**'
      - 'scripts/sync-brand-frontend.sh'
      - 'scripts/sync-static-site.sh'
      - 'Makefile'
      - '.github/workflows/deploy-mikepattyn-content.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/mikepattyn/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync brand site
        run: |
          chmod +x scripts/*.sh
          make sync-mikepattyn
